global
    log stdout format raw local7

defaults
    mode tcp
    timeout connect 5s
    timeout client 5s
    timeout server 5s

frontend amqp_in
    bind *:5672
    use_backend rmqs

backend rmqs
    balance roundrobin
    server rmq1 rmq1:5672
    server rmq2 rmq2:5672
    server rmq3 rmq3:5672
