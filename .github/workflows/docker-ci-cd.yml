name: cicd

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

  workflow_dispatch:
    branches: [ "main" ]

jobs:
  localhost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: fmt
        run: test "$(gofmt -l ./internal/app ./entry ./hello ./world ./hcheck ./internal/domain ./internal/infra | wc -l)" -eq "0"
      - name: lint
        run: go vet ./internal/app ./entry ./hello ./world ./hcheck ./internal/domain ./internal/infra
      - name: unittest
        run: go test -v ./internal/app ./internal/domain ./internal/infra
      - name: build-entry
        run: go build ./entry
      - name: build-hello
        run: go build ./hello
      - name: build-world
        run: go build ./world
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - shell: bash
        env:
          CA_KEY: ${{secrets.CA_KEY}}
        run:
          echo "$CA_KEY" > ca.key
      - shell: bash
        env:
          CA_CRT: ${{secrets.CA_CRT}}
        run:
          echo "$CA_CRT" > ca.crt
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          file: entry/Dockerfile
          push: true
          tags: ghcr.io/s20260526/m20260618-entry:latest
      - uses: docker/build-push-action@v7
        with:
          file: hello/Dockerfile
          push: true
          tags: ghcr.io/s20260526/m20260618-hello:latest
      - uses: docker/build-push-action@v7
        with:
          file: world/Dockerfile
          push: true
          tags: ghcr.io/s20260526/m20260618-world:latest
