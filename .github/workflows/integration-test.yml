name: intest

on:
  workflow_dispatch:
    branches: [ "main" ]

jobs:
  main:
    runs-on: ubuntu-latest

    services:
      entry:
        image: ghcr.io/s20260526/m20260618-entry:latest
        ports:
          - 8080:8080
      hello:
        image: ghcr.io/s20260526/m20260618-hello:latest
      world:
        image: ghcr.io/s20260526/m20260618-world:latest

    steps:
      - name: run
        run: test "$(wget -O - -q http://127.0.0.1:8080)" = 'Hello, World!'
