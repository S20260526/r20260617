name: testbench

services:
  entry1:
    image: ghcr.io/s20260526/m20260618-entry:latest
    depends_on:
      - config
    volumes:
      - ./ssl/ca.crt:/ca.crt
      - ./ssl/jwt.key:/jwt.key
      - ./ssl/jwt.pub:/jwt.pub
      - ./ssl/entry.crt:/client.crt
      - ./ssl/entry.key:/client.key
    networks:
      - default
      - vlk-net

  entry2:
    image: ghcr.io/s20260526/m20260618-entry:latest
    depends_on:
      - config
    volumes:
      - ./ssl/ca.crt:/ca.crt
      - ./ssl/jwt.key:/jwt.key
      - ./ssl/jwt.pub:/jwt.pub
      - ./ssl/entry.crt:/client.crt
      - ./ssl/entry.key:/client.key
    networks:
      - default
      - vlk-net

  hello:
    image: ghcr.io/s20260526/m20260618-hello:latest
    depends_on:
      - config
      - vlk-sentinel1
      - vlk-sentinel2
      - vlk-sentinel3
    volumes:
      - ./ssl/ca.crt:/ca.crt
      - ./ssl/hello.crt:/server.crt
      - ./ssl/hello.key:/server.key
    networks:
      - default
      - vlk-net

  world:
    image: ghcr.io/s20260526/m20260618-world:latest
    depends_on:
      - config
    volumes:
      - ./ssl/ca.crt:/ca.crt
      - ./ssl/world.crt:/server.crt
      - ./ssl/world.key:/server.key

  rabbitmqsink:
    image: ghcr.io/s20260526/m20260618-rabbitmqsink:latest
    volumes:
      - ./sink.txt:/sink.txt

  config:
    image: gcr.io/etcd-development/etcd:v3.7.1
    volumes:
      - etcd-data:/etcd-data
    command:
      - /usr/local/bin/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:2379
      - --data-dir=/etcd-data

  vlk-master:
    image: ghcr.io/valkey-io/valkey:alpine
    volumes:
      - valkey-data-master:/data
    command: valkey-server
    networks:
      vlk-net:
        ipv4_address: 172.28.0.10

  vlk-replica1:
    image: ghcr.io/valkey-io/valkey:alpine
    volumes:
      - valkey-data-replica1:/data
    command:
      - valkey-server
      - --replicaof
      - vlk-master
      - "6379"
    depends_on:
      - vlk-master
    networks:
      vlk-net:
        ipv4_address: 172.28.0.11

  vlk-replica2:
    image: ghcr.io/valkey-io/valkey:alpine
    volumes:
      - valkey-data-replica2:/data
    command:
      - valkey-server
      - --replicaof
      - vlk-master
      - "6379"
    depends_on:
      - vlk-master
    networks:
      vlk-net:
        ipv4_address: 172.28.0.12

  vlk-sentinel1:
    image: ghcr.io/valkey-io/valkey:alpine
    command:
      - valkey-sentinel
      - /etc/sentinel/sentinel.conf
    volumes:
      - ./valkey-sentinel-1.conf.d:/etc/sentinel
    depends_on:
      - vlk-master
    networks:
      vlk-net:
        ipv4_address: 172.28.0.21

  vlk-sentinel2:
    image: ghcr.io/valkey-io/valkey:alpine
    command:
      - valkey-sentinel
      - /etc/sentinel/sentinel.conf
    volumes:
      - ./valkey-sentinel-2.conf.d:/etc/sentinel
    depends_on:
      - vlk-master
    networks:
      vlk-net:
        ipv4_address: 172.28.0.22

  vlk-sentinel3:
    image: ghcr.io/valkey-io/valkey:alpine
    command:
      - valkey-sentinel
      - /etc/sentinel/sentinel.conf
    volumes:
      - ./valkey-sentinel-3.conf.d:/etc/sentinel
    depends_on:
      - vlk-master
    networks:
      vlk-net:
        ipv4_address: 172.28.0.23

  h:
    image: haproxy:3.0
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./ssl/entry.pem:/usr/local/etc/haproxy/certs/domain.pem:ro
    ports:
      - "8080:8080"
    depends_on:
      - entry1
      - entry2

  t:
    image: ubuntu:latest
    tty: true
    volumes:
      - ./ssl/ca.crt:/ca.crt
      - ./ssl/ca.key:/ca.key

  rmq1:
    image: rabbitmq:management
    environment:
      RABBITMQ_ERLANG_COOKIE: 99X9gv]QGdKEuT3wyw0xicPjLLYpsewK
      RABBITMQ_NODENAME: rabbit@rmq1
      RABBITMQ_CONFIG_FILE: /rabbitmq.conf
    volumes:
      - ./rabbitmq.conf:/rabbitmq.conf
      - ./rabbitmq.defs.json:/rabbitmq.defs.json

  rmq2:
    image: rabbitmq:management
    environment:
      RABBITMQ_ERLANG_COOKIE: 99X9gv]QGdKEuT3wyw0xicPjLLYpsewK
      RABBITMQ_NODENAME: rabbit@rmq2
      RABBITMQ_CONFIG_FILE: /rabbitmq.conf
    volumes:
      - ./rabbitmq.conf:/rabbitmq.conf
      - ./rabbitmq.defs.json:/rabbitmq.defs.json

  rmq3:
    image: rabbitmq:management
    environment:
      RABBITMQ_ERLANG_COOKIE: 99X9gv]QGdKEuT3wyw0xicPjLLYpsewK
      RABBITMQ_NODENAME: rabbit@rmq3
      RABBITMQ_CONFIG_FILE: /rabbitmq.conf
    volumes:
      - ./rabbitmq.conf:/rabbitmq.conf
      - ./rabbitmq.defs.json:/rabbitmq.defs.json

  rmq-entry:
    image: haproxy:3.0
    volumes:
      - ./haproxy-rmq.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - rmq1
      - rmq2
      - rmq3

  elasticsearch:
    image: elasticsearch:8.19.21
    environment:
      discovery.type: single-node
      xpack.security.enabled: false
      xpack.security.http.ssl.enabled: false
      xpack.security.transport.ssl.enabled: false
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
    ports:
      - "9200:9200"

  l:
    image: grafana/loki:3.7
    container_name: loki
    volumes:
      - loki-data:/loki
    restart: unless-stopped
    logging:
      driver: none

  f:
    image: ghcr.io/fluent/fluent-bit:4.2
    container_name: fluent-bit
    cap_add:
      - CAP_FOWNER
    volumes:
      - ./sink.txt:/sink.txt:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./fluent-bit.yaml:/fluent-bit/etc/fluent-bit.yaml:ro
      - fluent-bit-state:/var/fluent-bit/state
    depends_on:
      - l
    restart: unless-stopped
    command:
      - -c
      - /fluent-bit/etc/fluent-bit.yaml
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: none

  p:
    image: prom/prometheus:v3-busybox
    container_name: prometheus
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --storage.tsdb.retention.time=15d
    restart: unless-stopped
    ports:
      - "9090:9090"

  g:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "9060:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: nimda
    depends_on:
      - l
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-loki.yaml:/etc/grafana/provisioning/datasources/loki.yaml
      - ./grafana-prometheus.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml
    logging:
      driver: none

volumes:
  loki-data:
  fluent-bit-state:
  prometheus_data:
  grafana-data:
  etcd-data:
  valkey-data-master:
  valkey-data-replica1:
  valkey-data-replica2:

networks:
  vlk-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
