global
    log stdout format raw local7

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend https_in
    bind *:8080 ssl crt /usr/local/etc/haproxy/certs/domain.pem
    acl is_internal path_beg /prometrics || path_beg /hcheck
    http-request deny if is_internal
    use_backend services

backend services
    balance random
    server entry1 entry1:8080 maxconn 1000 weight 1
    server entry2 entry2:8080 maxconn 1000 weight 5
